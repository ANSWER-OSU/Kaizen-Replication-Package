[seed]
# Random seed configuration
# use_time_seed: if true, uses current time as seed; if false, uses fixed_seed value
use_time_seed = false
# fixed_seed: used when use_time_seed is false
fixed_seed = 123456

[mutation]
# Comment options file path (absolute path in container)
comment_options_file = /app/resources/mutation/comment-options.txt
# Mutation options config file path (absolute path in container)
mutation_options_config = /app/config/mutation-options.cfg
# False conditions file path (absolute path in container)
false_conditions_file = /app/resources/mutation/false-conditions.txt
# Dead code statements file path (absolute path in container)
dead_code_statements_file = /app/resources/mutation/dead-code-statements.txt
# Dead for loops file path (absolute path in container)
dead_for_loops_file = /app/resources/mutation/dead-for-loops.txt
# Dead while loops file path (absolute path in container)
dead_while_loops_file = /app/resources/mutation/dead-while-loops.txt
# Variable types file path (absolute path in container)
variable_types_file = /app/resources/mutation/variable-types.txt
# Variable values file path (absolute path in container)
variable_values_file = /app/resources/mutation/variable-values.txt
# Variable names file path (absolute path in container)
variable_names_file = /app/resources/mutation/variable-names.txt
